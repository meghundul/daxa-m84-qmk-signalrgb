name: Build Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install QMK CLI
        run: |
          python3 -m pip install --upgrade qmk

      - name: Clone QMK firmware (srgbmods fork for SN32 support)
        run: |
          git clone --depth 1 https://github.com/srgbmods/srgbmods-qmk-firmware.git ~/qmk_firmware
          cd ~/qmk_firmware
          python3 -m pip install -r requirements.txt
          make git-submodule

      - name: Copy keyboard definition
        run: |
          mkdir -p ~/qmk_firmware/keyboards/rexus
          cp -r keyboards/rexus/daxa_m84_ultimate ~/qmk_firmware/keyboards/rexus/daxa_m84_ultimate

      - name: Compile firmware
        run: |
          cd ~/qmk_firmware
          qmk compile -kb rexus/daxa_m84_ultimate -km default

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexus_daxa_m84_ultimate_default
          path: ~/qmk_firmware/rexus_daxa_m84_ultimate_default.bin
          retention-days: 30

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ~/qmk_firmware/rexus_daxa_m84_ultimate_default.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
